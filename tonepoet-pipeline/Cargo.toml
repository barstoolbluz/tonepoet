[package]
name = "tonepoet-pipeline"
version = "0.10.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Pure command-planning crate for tonepoet audio conversion pipelines"
repository = "https://github.com/barstoolbluz/tonepoet"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]

serde_json = "1"
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
