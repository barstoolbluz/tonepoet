[workspace]
members = ["crates/tonepoet-backend", "crates/tonepoet-features", "crates/tonepoet-wizard", "crates/sacd-rs", "crates/dvda-demuxer", "crates/dvdvideo", "crates/tui-file-picker", "tonepoet-pipeline"]
resolver = "2"

[package]
name = "tonepoet"
version = "0.4.8"
edition = "2021"
rust-version = "1.82"
description = "Standalone CLI + TUI audio conversion toolkit"
license = "GPL-3.0-or-later"

[dependencies]
tonepoet-pipeline = { path = "tonepoet-pipeline", features = ["serde"] }
fs2 = "0.4"
same-file = "1"
tonepoet-backend = { path = "crates/tonepoet-backend" }
tonepoet-features = { path = "crates/tonepoet-features" }
sacd-rs = { path = "crates/sacd-rs" }
dvda-demuxer = { path = "crates/dvda-demuxer" }
dvdvideo = { path = "crates/dvdvideo", default-features = false }
tonepoet-wizard = { path = "crates/tonepoet-wizard" }
tui-file-picker = { path = "crates/tui-file-picker" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }
lofty = "0.21"
id3 = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ring = "0.17"
log = "0.4"
env_logger = "0.10"
anyhow = "1"
thiserror = "1"
dirs = "5"
regex = "1"
lazy_static = "1"
html-escape = "0.2"
metaflac = "0.2"
num_cpus = "1"
walkdir = "2"
fuzzy-matcher = "0.3"
tempfile = "3"
indicatif = "0.17"
ratatui = "0.26"
crossterm = "0.27"
ratatui-image = { version = "=1.0.5", default-features = false, features = ["crossterm", "rustix"] }
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
once_cell = "1"
humansize = "2"
ffmpeg-next = "7.1"
rusqlite = { version = "0.39", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
crc32fast = "1"
rustfft = "6"
base64 = "0.22"
rayon = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
rustix = { version = "0.38", features = ["fs"] }
md-5 = "0.10"
encoding_rs = "0.8"
getrandom = "0.2"
libbluray-sys = { version = "=1.0.1", default-features = false }

[dev-dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
# Tokio's virtual-clock helpers (`time::pause`, `time::advance`) live
# behind the `test-util` feature and aren't in `features = ["full"]`.
# Used by the MB rate limiter sequencing test.
tokio = { version = "1", features = ["test-util"] }
