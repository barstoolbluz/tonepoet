[workspace]
members = ["crates/tonepoet-backend", "crates/tonepoet-features", "crates/tonepoet-wizard", "crates/sacd-rs"]
resolver = "2"

[package]
name = "tonepoet"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Standalone CLI + TUI audio conversion toolkit"
license = "GPL-3.0-or-later"

[dependencies]
fs2 = "0.4"
tonepoet-backend = { path = "crates/tonepoet-backend" }
tonepoet-features = { path = "crates/tonepoet-features" }
sacd-rs = { path = "crates/sacd-rs" }
tonepoet-wizard = { path = "crates/tonepoet-wizard" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }
lofty = "0.21"
log = "0.4"
env_logger = "0.10"
anyhow = "1"
thiserror = "1"
dirs = "5"
regex = "1"
lazy_static = "1"
html-escape = "0.2"
metaflac = "0.2"
num_cpus = "1"
walkdir = "2"
fuzzy-matcher = "0.3"
tempfile = "3"
indicatif = "0.17"
ratatui = "0.26"
crossterm = "0.27"
once_cell = "1"
trash = "4"
humansize = "2"
ffmpeg-next = "7.1"
rusqlite = { version = "0.39", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
crc32fast = "1"
rustfft = "6"
base64 = "0.22"
rayon = "1"
sha2 = "0.10"
md-5 = "0.10"

[dev-dependencies]
# Tokio's virtual-clock helpers (`time::pause`, `time::advance`) live
# behind the `test-util` feature and aren't in `features = ["full"]`.
# Used by the MB rate limiter sequencing test.
tokio = { version = "1", features = ["test-util"] }
