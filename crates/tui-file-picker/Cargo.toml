[package]
name = "tui-file-picker"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Reusable ratatui/crossterm file picker and file-browser overlay"
license = "MIT OR Apache-2.0"

[features]
default = ["image-preview"]
image-preview = ["dep:ratatui-image", "dep:image"]

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
unicode-width = "0.1"
ratatui-image = { version = "=1.0.5", optional = true, default-features = false, features = ["crossterm", "rustix"] }
image = { version = "=0.25.6", optional = true, default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }

[dev-dependencies]
tempfile = "3"
