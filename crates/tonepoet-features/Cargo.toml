[package]
name = "tonepoet-features"
version = "0.1.0"
edition = "2021"
description = "Log file and cue file generation for tonepoet conversions"

[lib]
name = "tonepoet_features"
path = "src/mod.rs"

[[example]]
name = "integration_demo"
path = "examples/integration_demo.rs"

[[example]]
name = "test_log_writer"
path = "examples/test_log_writer.rs"

[[example]]
name = "test_cue_generator"
path = "examples/test_cue_generator.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"

# File system utilities
dirs = "5.0"

# Conversion settings types for comprehensive logging
tonepoet-backend = { path = "../tonepoet-backend" }

# Metadata extraction (add as needed for implementation)
# id3 = "1.0"           # MP3 metadata
# opus_headers = "0.1"  # Opus metadata  
# mp4ameta = "0.11"     # AAC metadata

[dev-dependencies]
# Testing utilities
tempfile = "3.0"
pretty_assertions = "1.4"

# Integration testing
tokio-test = "0.4"