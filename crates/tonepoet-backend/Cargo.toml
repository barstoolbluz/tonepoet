[package]
name = "tonepoet-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
env_logger = "0.11"
tempfile = "3.0"
pretty_assertions = "1.4"